< <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Sign-In Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #ff9a56, #ffca28, #ff7043, #8bc34a, #ff5722, #ffc107);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 193, 7, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 87, 34, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(139, 195, 74, 0.3) 0%, transparent 50%);
            animation: floatingOrbs 20s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes floatingOrbs {
            0%, 100% {
                transform: translate(0px, 0px) rotate(0deg);
            }
            33% {
                transform: translate(30px, -30px) rotate(120deg);
            }
            66% {
                transform: translate(-20px, 20px) rotate(240deg);
            }
        }

        .container {
            max-width: 350px;
            background: #F8F9FD;
            background: linear-gradient(0deg, rgb(255, 255, 255) 0%, rgb(244, 247, 251) 100%);
            border-radius: 40px;
            padding: 25px 35px;
            border: 5px solid rgb(255, 255, 255);
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 30px 30px -20px;
            margin: 20px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
            animation: containerFloat 6s ease-in-out infinite;
        }

        @keyframes containerFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .heading {
            text-align: center;
            font-weight: 900;
            font-size: 30px;
            color: rgb(16, 137, 211);
        }

        .form {
            margin-top: 20px;
        }

        .form .input {
            width: 100%;
            background: white;
            border: none;
            padding: 15px 20px;
            border-radius: 20px;
            margin-top: 15px;
            box-shadow: #cff0ff 0px 10px 10px -5px;
            border-inline: 2px solid transparent;
        }

        .form .input::-moz-placeholder {
            color: rgb(170, 170, 170);
        }

        .form .input::placeholder {
            color: rgb(170, 170, 170);
        }

        .form .input:focus {
            outline: none;
            border-inline: 2px solid #12B1D1;
        }

        .form .forgot-password {
            display: block;
            margin-top: 10px;
            margin-left: 10px;
        }

        .form .forgot-password a {
            font-size: 11px;
            color: #0099ff;
            text-decoration: none;
        }

        .form .login-button {
            display: block;
            width: 100%;
            font-weight: bold;
            background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
            color: white;
            padding-block: 15px;
            margin: 20px auto;
            border-radius: 20px;
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 20px 10px -15px;
            border: none;
            transition: all 0.2s ease-in-out;
        }

        .form .login-button:hover {
            transform: scale(1.03);
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 23px 10px -20px;
        }

        .form .login-button:active {
            transform: scale(0.95);
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 15px 10px -10px;
        }

        .social-account-container {
            margin-top: 25px;
        }

        .social-account-container .title {
            display: block;
            text-align: center;
            font-size: 10px;
            color: rgb(170, 170, 170);
        }

        .social-account-container .social-accounts {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
        }

        .social-account-container .social-accounts .social-button {
            background: linear-gradient(45deg, rgb(0, 0, 0) 0%, rgb(112, 112, 112) 100%);
            border: 5px solid white;
            padding: 5px;
            border-radius: 50%;
            width: 40px;
            aspect-ratio: 1;
            display: grid;
            place-content: center;
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 12px 10px -8px;
            transition: all 0.2s ease-in-out;
        }

        .social-account-container .social-accounts .social-button .svg {
            fill: white;
            margin: auto;
        }

        .social-account-container .social-accounts .social-button:hover {
            transform: scale(1.2);
        }

        .social-account-container .social-accounts .social-button:active {
            transform: scale(0.9);
        }

        .agreement {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .agreement a {
            text-decoration: none;
            color: #0099ff;
            font-size: 9px;
        }

        /* Animated Food Items */
        .food-item {
            position: absolute;
            font-size: 2.5rem;
            animation: floatFood 8s infinite linear;
            opacity: 0.8;
            z-index: 1;
        }

        .food-item:nth-child(1) { 
            left: 5%; 
            animation-delay: 0s; 
            animation-duration: 12s;
        }
        .food-item:nth-child(2) { 
            left: 15%; 
            animation-delay: -2s; 
            animation-duration: 10s;
        }
        .food-item:nth-child(3) { 
            left: 25%; 
            animation-delay: -4s; 
            animation-duration: 14s;
        }
        .food-item:nth-child(4) { 
            left: 35%; 
            animation-delay: -6s; 
            animation-duration: 11s;
        }
        .food-item:nth-child(5) { 
            left: 45%; 
            animation-delay: -8s; 
            animation-duration: 13s;
        }
        .food-item:nth-child(6) { 
            left: 55%; 
            animation-delay: -10s; 
            animation-duration: 9s;
        }
        .food-item:nth-child(7) { 
            left: 65%; 
            animation-delay: -12s; 
            animation-duration: 15s;
        }
        .food-item:nth-child(8) { 
            left: 75%; 
            animation-delay: -14s; 
            animation-duration: 12s;
        }
        .food-item:nth-child(9) { 
            left: 85%; 
            animation-delay: -16s; 
            animation-duration: 10s;
        }
        .food-item:nth-child(10) { 
            left: 95%; 
            animation-delay: -18s; 
            animation-duration: 11s;
        }

        @keyframes floatFood {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Bouncing Food Items */
        .bouncing-food {
            position: absolute;
            font-size: 3rem;
            animation: bounceFood 4s infinite ease-in-out;
            z-index: 1;
        }

        .bouncing-food:nth-child(11) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        .bouncing-food:nth-child(12) {
            top: 20%;
            right: 15%;
            animation-delay: -1s;
        }
        .bouncing-food:nth-child(13) {
            bottom: 30%;
            left: 8%;
            animation-delay: -2s;
        }
        .bouncing-food:nth-child(14) {
            bottom: 15%;
            right: 20%;
            animation-delay: -3s;
        }

        @keyframes bounceFood {
            0%, 100% {
                transform: translateY(0px) rotate(0deg) scale(1);
            }
            25% {
                transform: translateY(-20px) rotate(90deg) scale(1.1);
            }
            50% {
                transform: translateY(-40px) rotate(180deg) scale(1.2);
            }
            75% {
                transform: translateY(-20px) rotate(270deg) scale(1.1);
            }
        }

        /* Spinning Food Items */
        .spinning-food {
            position: absolute;
            font-size: 2rem;
            animation: spinFood 6s infinite linear;
            z-index: 1;
        }

        .spinning-food:nth-child(15) {
            top: 5%;
            left: 50%;
            animation-delay: 0s;
        }
        .spinning-food:nth-child(16) {
            top: 60%;
            left: 5%;
            animation-delay: -2s;
        }
        .spinning-food:nth-child(17) {
            top: 40%;
            right: 5%;
            animation-delay: -4s;
        }

        @keyframes spinFood {
            0% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(180deg) scale(1.3);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }
    </style>
</head>
<body>
    <!-- Floating Food Items -->
    <div class="food-item">🍕</div>
    <div class="food-item">🍔</div>
    <div class="food-item">🍟</div>
    <div class="food-item">🌮</div>
    <div class="food-item">🍝</div>
    <div class="food-item">🍜</div>
    <div class="food-item">🍛</div>
    <div class="food-item">🥙</div>
    <div class="food-item">🌯</div>
    <div class="food-item">🥗</div>

    <!-- Bouncing Food Items -->
    <div class="bouncing-food">🍰</div>
    <div class="bouncing-food">🧁</div>
    <div class="bouncing-food">🍩</div>
    <div class="bouncing-food">🍪</div>

    <!-- Spinning Food Items -->
    <div class="spinning-food">☕</div>
    <div class="spinning-food">🥤</div>
    <div class="spinning-food">🍺</div>

    <div class="container">
        <div class="heading">Sign In</div>
        <form action="" class="form">
            <input required="" class="input" type="email" name="email" id="email" placeholder="E-mail">
            <input required="" class="input" type="password" name="password" id="password" placeholder="Password">
            <span class="forgot-password"><a href="#">Forgot Password ?</a></span>
            <input class="login-button" type="submit" value="Sign In">
        </form>
        <div class="social-account-container">
            <span class="title">Or Sign in with</span>
            <div class="social-accounts">
                <button class="social-button google">
                    <svg class="svg" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 488 512">
                        <path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"></path>
                    </svg>
                </button>
                <button class="social-button apple">
                    <svg class="svg" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 384 512">
                        <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"></path>
                    </svg>
                </button>
                <button class="social-button twitter">
                    <svg class="svg" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512">
                        <path d="M389.2 48h70.6L305.6 224.2 487 464H345L233.7 318.6 106.5 464H35.8L200.7 275.5 26.8 48H172.4L272.9 180.9 389.2 48zM364.4 421.8h39.1L151.1 88h-42L364.4 421.8z"></path>
                    </svg>
                </button>
            </div>
        </div>
        <span class="agreement"><a href="#">Learn user licence agreement</a></span>
    </div>
</body>
</html>
