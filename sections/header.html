<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Food Restaurant</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>TastyBites</h1>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search for your favorite food..." aria-label="Search food items">
                <button title="Search" aria-label="Search for food">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div class="nav-links">
                <a href="#hero">Home</a>
                <a href="#menu">Menu</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </div>
            <div class="nav-buttons">
                <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="cart-btn" title="Shopping cart" aria-label="Open shopping cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" aria-label="Cart items count">0</span>
                </button>
                <button class="order-now">Order Now</button>
            </div>
        </div>
    </nav>

    <header>
        <h1>Welcome to Our Fast Food Restaurant</h1>
    </header>

    <section id="hero">
        <!-- Hero section content -->
    </section>

    <section id="menu">
        <!-- Menu section content -->
    </section>

    <section id="about">
        <!-- About section content -->
    </section>

    <section id="contact">
        <!-- Contact section content -->
    </section>

    <script src="script.js"></script>
</body>

</html>
